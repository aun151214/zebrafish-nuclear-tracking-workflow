[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafish-nuclear-tracking"
version = "0.1.0.dev0"
description = "Pre-release utilities for zebrafish nuclear tracking workflows"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tifffile>=2024.0",
  "h5py>=3.10",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
